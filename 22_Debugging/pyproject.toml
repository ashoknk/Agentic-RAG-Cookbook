[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "22_debugging"
version = "0.1.0"
description = "LangGraph debugging environment"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=0.1.0",
    "langgraph>=0.2.0",
    "langgraph-api>=0.11.2",
    "python-dotenv>=1.0.0",
]
